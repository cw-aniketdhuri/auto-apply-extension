<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 15px;
      width: 320px;
      margin: 0;
      color: #1e293b;
      background-color: #f8fafc;
    }
    h2 {
      margin-top: 0;
      font-size: 18px;
      color: #0f172a;
    }
    p {
      font-size: 11px;
      color: #64748b;
      line-height: 1.4;
    }
    label {
      font-size: 12px;
      font-weight: 600;
      display: block;
      margin-top: 10px;
    }
    textarea {
      width: 95%;
      height: 150px;
      margin-top: 6px;
      padding: 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-family: monospace;
      font-size: 11px;
      resize: vertical;
      background-color: #fff;
    }
    button {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      margin-top: 12px;
      transition: all 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-vision {
      background-color: #7c3aed;
      color: white;
    }
    .btn-vision:hover {
      background-color: #6d28d9;
    }
    .btn-stop {
      background-color: #ef4444;
      color: white;
      display: none;
    }
    .btn-stop:hover {
      background-color: #dc2626;
    }
    .status-msg {
      margin-top: 15px;
      padding: 12px;
      border-radius: 6px;
      font-size: 11px;
      line-height: 1.4;
      display: none;
      border: 1px solid #e2e8f0;
      font-family: monospace;
      max-height: 250px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <h2>👁️ Vision AutoApply</h2>
  <p>Uses Gemini to visually read the entire page (Job Description + Form), draft custom cover letters, and fill out inputs [source: 11].</p>

  <label for="master-resume">📝 Master Resume:</label>
  <textarea id="master-resume" placeholder="Paste your master resume here..."></textarea>

  <button id="vision-apply-btn" class="btn-vision">
    <span>🚀 Run Vision Filler</span>
  </button>
  
  <button id="stop-btn" class="btn-stop">
    <span>🛑 Stop Process (Esc)</span>
  </button>

  <div id="status-box" class="status-msg"></div>

  <script src="sidepanel.js"></script>
</body>
</html>
